services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anlu
      POSTGRES_USER: anlu
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anlu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anlu"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://anlu:local-only-change-me@db:5432/anlu
      COOKIE_SECURE: "false"
      MODEL_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  anlu_pg:
