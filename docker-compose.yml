services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: healthbridge
      POSTGRES_USER: healthbridge
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - healthbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://healthbridge:local-only-change-me@db:5432/healthbridge
      COOKIE_SECURE: "false"
      MODEL_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  healthbridge_pg:

