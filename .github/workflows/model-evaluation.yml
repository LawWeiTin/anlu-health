name: Scheduled model and safety evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/evaluate.py --strict --output artifacts/eval.json
      - run: python scripts/evaluate_rag.py --strict --output artifacts/rag_eval.json
      - run: python scripts/check_source_freshness.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-medical-safety-report
          path: |
            artifacts/eval.json
            artifacts/rag_eval.json
          retention-days: 90
