name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -q -r app scripts training -x tests
      - name: Public release credential and metadata gate
        run: python scripts/check_public_release.py
      - name: Unit and integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Medical safety release gate
        run: python scripts/evaluate.py --strict --output artifacts/eval.json
      - name: Hybrid RAG release gate
        run: python scripts/evaluate_rag.py --strict --output artifacts/rag_eval.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-and-rag-evaluation
          path: |
            artifacts/eval.json
            artifacts/rag_eval.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production container
        run: docker build --tag anlu-health:${{ github.sha }} .
