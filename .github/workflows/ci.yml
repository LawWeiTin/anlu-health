name: CI

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit -q -r app scripts training -x tests
      - name: Unit and integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Medical safety release gate
        run: python scripts/evaluate.py --strict --output artifacts/eval.json
      - name: Hybrid RAG release gate
        run: python scripts/evaluate_rag.py --strict --output artifacts/rag_eval.json
      - uses: actions/upload-artifact@v7
        with:
          name: safety-and-rag-evaluation
          path: |
            artifacts/eval.json
            artifacts/rag_eval.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag anlu-health:${{ github.sha }} .
