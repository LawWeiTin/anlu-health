# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: anlu-health-web
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head && python scripts/ingest.py data/seed_knowledge.jsonl
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Anlu Health
      - key: DATABASE_URL
        fromDatabase:
          name: anlu-health-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: SAVE_CHAT_HISTORY
        value: "false"
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: EMERGENCY_NUMBER
        value: "995"
      - key: EMERGENCY_REGION
        value: Singapore
      - key: MODEL_PROVIDER
        value: openai_compatible
      - key: MODEL_API_URL
        value: https://router.huggingface.co/v1
      - key: HF_TOKEN
        sync: false
      - key: MODEL_NAME
        value: Qwen/Qwen3.5-9B:cheapest
      - key: EMBEDDING_PROVIDER
        value: tei
      - key: EMBEDDING_API_URL
        value: https://router.huggingface.co/hf-inference/models/intfloat/multilingual-e5-small
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: METRICS_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: anlu-health-db
    plan: basic-256mb
    region: singapore
    databaseName: anlu
    user: anlu
    postgresMajorVersion: "16"
    ipAllowList: []
