provider: google_drive
owner: redacted-public-repository
policy: additive_only
root:
  name: Anlu Health
  id: redacted-private-folder-id
  url: private-drive-location-redacted
folders:
  datasets:
    id: redacted-private-folder-id
  model_adapters:
    id: redacted-private-folder-id
  evaluation_reports:
    id: redacted-private-folder-id
  release_artifacts:
    id: redacted-private-folder-id
rules:
  - Never delete or move existing Drive content.
  - Create a new UTC-timestamped directory for every training or evaluation run.
  - Never upload raw user conversations.
  - Keep access private unless the owner explicitly changes sharing.
